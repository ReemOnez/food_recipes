name: recipes
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.1


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.6
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.4
  google_sign_in: ^6.3.0

flutter_native_splash:
  color: "#fff8e5"
  fullscreen: true
  image: assets/icons/logo.jpg

  android_12:
    color: "#fff8e5"
    image: assets/icons/logo.jpg
    icon_background_color: "#fff8e5"


  android: true
  ios: true
  web: false


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:

  uses-material-design: true

  assets:
    - assets/icons/

flutter_icons:
  image_path: assets/icons/logo.jpg
  ios: true
  android: "launcher_icon"
  adaptive_icon_background: "#fff8e5"
