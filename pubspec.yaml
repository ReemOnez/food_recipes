name: recipes
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.1


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  flutter_riverpod: ^2.6.1
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.21.2
  shared_preferences: ^2.5.3
  flutter_screenutil: ^5.9.3
  flutter_native_splash: ^2.4.6
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.4
  google_sign_in: ^6.3.0
  equatable: ^2.0.7
  flutter_localization: ^0.3.2
  intl: ^0.20.2
  flutter_svg: ^2.2.0
  flutter_spinkit: ^5.2.1

flutter_native_splash:
  color: "#fff8e5"
  fullscreen: true
  image: assets/icons/logo.jpg

  android_12:
    color: "#fff8e5"
    image: assets/icons/logo.jpg
    icon_background_color: "#fff8e5"


  android: true
  ios: true
  web: false


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:

  uses-material-design: true
  generate: true

  assets:
    - assets/icons/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-Black.ttf
          weight: 900
        - asset: assets/fonts/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/Cairo-ExtraLight.ttf
          weight: 200

flutter_icons:
  image_path: assets/icons/logo.jpg
  ios: true
  android: "launcher_icon"
  adaptive_icon_background: "#fff8e5"
